<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS - Grateful Water Station</title>
    {% load static %}
    <link rel="icon" type="image/png" href="{% static 'accounts/images/for login image.png' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .redirect-container {
            text-align: center;
            padding: 2rem;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1.5rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .redirect-container p {
            color: white;
            font-size: 1.1rem;
            margin-bottom: 1rem;
        }

        .redirect-link {
            color: white;
            text-decoration: none;
            background: rgba(255,255,255,0.2);
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            display: inline-block;
            transition: all 0.3s ease;
        }

        .redirect-link:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }
    </style>
</head>
<body data-live-updates-url="{% url 'live_updates_api' %}">
<script src="{% static 'accounts/js/live_updates.js' %}" defer></script>

    <script>
        window.location.href = "{% url 'create_sale' %}";
    </script>
</body>
</html>
