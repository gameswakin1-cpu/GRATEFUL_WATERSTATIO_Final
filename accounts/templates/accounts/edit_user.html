<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit User - Grateful Water Station</title>
    {% load static %}
     <link rel="icon" type="image/png" href="{% static 'accounts/images/for login image.png' %}">
    <link rel="shortcut icon" href="{% static 'accounts/images/for login image.png' %}">
    <link rel="stylesheet" href="{% static 'accounts/css/styles.css' %}">
</head>
<body data-live-updates-url="{% url 'live_updates_api' %}">
<script src="{% static 'accounts/js/live_updates.js' %}" defer></script>
    <div class="dashboard-container">
       <nav class="sidebar">
            <div class="sidebar-header">
                <div class="brand-icon"><img src="{% static 'accounts/images/for login image.png' %}" alt="Grateful logo"></div>
                <h2>GRATEFUL</h2>
                <p>Admin Panel</p>
            </div>
            {% include "accounts/admin_nav_links.html" %}
            <div class="user-info">
            </div>
        </nav>
        
        
        <main class="main-content">
            <header class="dashboard-header">
                <h1>Edit User: {{ edit_user.username }}</h1>
                <a href="{% url 'manage_users' %}" class="btn-primary">Back to Users</a>
            
            <div class='header-actions dashboard-topbar-actions'>
                {% include 'accounts/dashboard_header_actions.html' %}
            </div>
        </header>
            
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
            
            <div class="edit-form-container" style="max-width: 600px; margin: 0 auto;">
                <form method="POST" class="modal-form">
                    {% csrf_token %}
                    
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" value="{{ edit_user.username }}" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" value="{{ edit_user.email }}" required>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="first_name">First Name</label>
                            <input type="text" id="first_name" name="first_name" value="{{ edit_user.first_name }}" required>
                        </div>
                        <div class="form-group">
                            <label for="last_name">Last Name</label>
                            <input type="text" id="last_name" name="last_name" value="{{ edit_user.last_name }}" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="phone_number">Phone Number</label>
                        <input type="text" id="phone_number" name="phone_number" value="{{ edit_user.profile.phone_number }}" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="address">Address</label>
                        <textarea id="address" name="address" rows="3" required>{{ edit_user.profile.address }}</textarea>
                    </div>
                    
                    <div class="form-group">
                        <label for="role">Role</label>
                        <select id="role" name="role" required>
                            <option value="admin" {% if edit_user.profile.role == 'admin' %}selected{% endif %}>Admin</option>
                            <option value="staff" {% if edit_user.profile.role == 'staff' %}selected{% endif %}>Staff</option>
                            <option value="rider" {% if edit_user.profile.role == 'rider' %}selected{% endif %}>Rider</option>
                            <option value="customer" {% if edit_user.profile.role == 'customer' %}selected{% endif %}>Customer</option>
                        </select>
                    </div>
                    
                    <button type="submit" class="btn-primary">Update User</button>
                </form>
            </div>
        </main>
    </div>
    
    <script src="{% static 'accounts/js/main.js' %}"></script>
    <script>
        // Reports dropdown toggle handler
        document.addEventListener('DOMContentLoaded', () => {
            const reportsToggle = document.querySelector('.nav-dropdown-toggle');
            if (reportsToggle) {
                reportsToggle.addEventListener('click', (event) => {
                    event.preventDefault();
                    event.stopPropagation();
                    reportsToggle.parentElement.classList.toggle('active');
                });
            }
        });
    </script>
</body>
</html>
