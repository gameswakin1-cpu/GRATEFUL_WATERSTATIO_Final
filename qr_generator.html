<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator - Localhost</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.5rem;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        #qrcode {
            margin-top: 30px;
            display: flex;
            justify-content: center;
        }
        .info {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            font-size: 0.85rem;
            color: #666;
        }
        .info strong {
            color: #333;
        }
        .wifi-ip {
            background: #d1fae5;
            border: 2px solid #10b981;
            color: #065f46;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 600;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 QR Code Generator</h1>
        <p class="subtitle">Generate QR code to open your Django app on mobile</p>
        
        <div class="wifi-ip">
            ✅ Use your <strong>Wi-Fi IP</strong>: 192.168.1.145
        </div>
        
        <div class="input-group">
            <label for="ipAddress">IP Address:</label>
            <input type="text" id="ipAddress" value="192.168.1.145" placeholder="e.g., 192.168.1.145">
        </div>
        
        <div class="input-group">
            <label for="port">Port:</label>
            <input type="text" id="port" value="8000" placeholder="e.g., 8000">
        </div>
        
        <button onclick="generateQR()">Generate QR Code</button>
        
        <div id="qrcode" class="hidden"></div>
        
        <div class="info" id="infoBox">
            <strong>Instructions:</strong><br>
            1. Connect phone to <strong>same WiFi</strong> as your computer<br>
            2. Run: <code>python manage.py runserver 0.0.0.0:8000</code><br>
            3. Scan QR code with phone camera
        </div>
        
        <div class="info" id="urlDisplay" style="margin-top: 15px; display: none;">
            <strong>URL:</strong> <span id="generatedUrl"></span>
        </div>
    </div>

    <script>
        let qrcode = null;
        
        function generateQR() {
            const ip = document.getElementById('ipAddress').value.trim();
            const port = document.getElementById('port').value.trim();
            
            if (!ip || !port) {
                alert('Please enter both IP address and port');
                return;
            }
            
            const url = `http://${ip}:${port}`;
            
            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = '';
            
            qrcode = new QRCode(qrContainer, {
                text: url,
                width: 200,
                height: 200,
                colorDark: '#000000',
                colorLight: '#ffffff',
                correctLevel: QRCode.CorrectLevel.M
            });
            
            qrContainer.classList.remove('hidden');
            document.getElementById('generatedUrl').textContent = url;
            document.getElementById('urlDisplay').style.display = 'block';
        }
        
        window.onload = generateQR;
    </script>
</body>
</html>
